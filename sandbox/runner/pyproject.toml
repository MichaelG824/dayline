[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dayline-runner"
version = "0.1.0"
description = "Runs Dayline mock-interview sandboxes: one locked-down Docker container per session."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Gee" }]

# The only Dayline process with Docker access. Kept separate from the Dayline
# API so untrusted code can never reach the planner or its credentials.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "docker>=7.1",
    # The preview proxy: an HTTP client over exec tunnels, and the sans-I/O
    # WebSocket client that bridges hot-reload sockets.
    "httpcore>=1.0",
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dayline_runner"]
