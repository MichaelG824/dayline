[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dayline"
version = "0.1.0"
description = "A personal planning agent that turns a task list into a time-blocked daily plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Gee" }]

# The planning core and adapter interfaces are deliberately dependency-free
# (stdlib only). FastAPI/uvicorn back the interactive UI: a thin JSON layer
# over the core, consumed by the Next.js frontend in web/. Supabase is the
# real persistent backend for tasks/applications/interviews (see
# supabase/schema.sql) - the service_role key is used server-side only, never
# exposed to web/. Anthropic backs the chat propose/confirm feature.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Backs GoogleCalendarClient (adapters/calendar.py), live today for pushing
# interviews to Google Calendar (see GOOGLE_SETUP.md, api/main.py's
# /api/calendar/* endpoints). Needs credentials.json - the tree stays
# importable and testable without installing this or completing that setup.
google = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "debugpy>=1.8",
    "docker>=7.1",
]

[project.scripts]
dayline = "dayline.scheduler.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dayline"]

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox/runner/tests"]
pythonpath = ["src", "sandbox/runner/src"]
addopts = "-ra"
markers = [
    "docker: needs a Docker daemon; runs only with RUN_DOCKER_TESTS=1",
]

[tool.ruff]
src = ["src", "tests", "sandbox/runner/src", "sandbox/runner/tests"]
line-length = 100
target-version = "py311"
# Practice-repo templates are candidate code (with deliberate bugs), not ours.
extend-exclude = ["src/dayline/mock/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture projects: other languages' source, kept as written.
"tests/generated_projects/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:sandbox/runner/src"
packages = ["dayline", "dayline_runner"]
strict = true
# Staged-round content (starter code, hidden tests, references) is written
# like interview code, untyped; tests/test_staged_lru.py runs it instead.
exclude = ["src/dayline/mock/staged_problems/"]

# The google extra ships no type stubs/py.typed marker; GoogleCalendarClient
# is the only caller and already narrows its surface to plain str/dict types.
# ``follow_imports = "skip"`` matters when the extra IS installed: without it
# mypy reads the untyped sources and strict mode flags every call into them.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.*",
    "httplib2.*",
    "google_auth_httplib2.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# The Docker SDK ships no type information; only dayline_runner.manager uses it.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
